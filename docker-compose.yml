version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: travelfactory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tfuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tfpassword}
      POSTGRES_DB: ${POSTGRES_DB:-travelfactory}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tfuser}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
